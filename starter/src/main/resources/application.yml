spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_test}
    username: ${DB_USERNAME:order_test}
    password: ${DB_PASSWORD:order_test}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}
