services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_test
      POSTGRES_USER: order_test
      POSTGRES_PASSWORD: order_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_test -d order_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - order-test-postgres:/var/lib/postgresql/data

volumes:
  order-test-postgres:
